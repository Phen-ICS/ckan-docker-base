stages:
  - test
  - publish

variables:
  CKAN_MAJOR_VERSION: "2.11"
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  GIT_DEPTH: "0"

.docker_job: &docker_job
  image: docker:28.1.1
  services:
    - name: docker:28.1.1-dind
      alias: docker
  tags:
    - ics-docker

test_ckan_2_11_images:
  <<: *docker_job
  stage: test
  script:
    - .gitlab/scripts/test-ckan-images.sh

publish_ckan_2_11_images:
  <<: *docker_job
  stage: publish
  needs:
    - test_ckan_2_11_images
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  before_script:
    - apk add --no-cache git
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - .gitlab/scripts/publish-ckan-images.sh
